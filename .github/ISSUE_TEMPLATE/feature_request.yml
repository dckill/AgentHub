name: 功能建议
description: 提议符合当前产品范围的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 说明要解决的场景，而不只是期望实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
  - type: checkboxes
    id: scope
    attributes:
      label: 产品范围
      options:
        - label: 该建议面向 Claude Code、Codex 或两者共有能力
          required: true
