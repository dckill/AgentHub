name: Expo App TypeScript typecheck

on:
    pull_request:
        branches:
            - master
            - main
        paths:
            - 'packages/agenthub-app/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - master
            - main
        paths:
            - 'packages/agenthub-app/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - '.github/workflows/typecheck.yml'

jobs:
    typecheck:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: TypeScript typecheck
              run: pnpm --filter agenthub-app typecheck
