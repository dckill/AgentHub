apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agenthub-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: agenthub-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /agenthub-db
    - extract:
        key: /agenthub-data-encryption
    - extract:
        key: /agenthub-token-signing
    - extract:
        key: /agenthub-github
    - extract:
        key: /agenthub-files
    - extract:
        key: /agenthub-e2b
    - extract:
        key: /agenthub-revenuecat
    - extract:
        key: /agenthub-elevenlabs
