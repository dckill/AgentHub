apiVersion: v1
kind: Secret
metadata:
  name: agenthub-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://agenthub:<password>@postgres:5432/agenthub
  AGENTHUB_DATA_ENCRYPTION_KEY_VERSION: "1"
  AGENTHUB_DATA_ENCRYPTION_KEYS: '{"1":"<generate-independent-random-secret>"}'
  AGENTHUB_TOKEN_KEY_VERSION: "1"
  AGENTHUB_TOKEN_KEYS: '{"1":"<generate-different-random-secret>"}'
  S3_HOST: minio
  S3_PORT: "9000"
  S3_USE_SSL: "false"
  S3_ACCESS_KEY: <local-access-key>
  S3_SECRET_KEY: <local-secret-key>
  S3_BUCKET: agenthub
