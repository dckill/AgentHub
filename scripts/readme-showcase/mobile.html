<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AgentHub 移动端产品展示</title>
  <style>
    @font-face {
      font-family: "Source Han Sans";
      src: url("file:///home/yzsd/.local/share/fonts/SourceHanSansSC-Regular.otf");
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 2338px; overflow: hidden; }
    body {
      --canvas:#070a0b; --canvas2:#0b1012; --surface:rgba(15,22,25,.94); --raised:#151e22;
      --hover:#1b272c; --line:rgba(238,248,250,.13); --line2:rgba(255,202,116,.48);
      --text:#f3efe7; --sub:#c8c0b4; --muted:#7a8790; --accent:#ffb22e;
      --accent2:#f6a21a; --soft:rgba(255,178,46,.12); --green:#50c878;
      --red:#ff726a; --blue:#65aaff; --code:#090c0e;
      font-family:"Source Han Sans","WenQuanYi Zen Hei",sans-serif;
      background:var(--canvas); color:var(--text);
    }
    body.light {
      --canvas:#f6f9fa; --canvas2:#eef4f6; --surface:rgba(255,255,255,.88); --raised:#ffffff;
      --hover:#eef4f5; --line:rgba(28,44,52,.14); --line2:rgba(217,144,18,.42);
      --text:#0e1720; --sub:#485866; --muted:#75828c; --accent:#d99012;
      --accent2:#b76d00; --soft:rgba(217,144,18,.11); --green:#0f7844;
      --red:#c7352e; --blue:#276dd4; --code:#f9fcfc;
    }
    #root { width:1080px; height:2338px; position:relative; overflow:hidden; background:
      radial-gradient(circle at 92% 3%, var(--soft), transparent 24%), var(--canvas); }
    .screen { width:100%; height:100%; display:flex; flex-direction:column; position:relative; }
    .statusbar { height:78px; padding:24px 46px 0; display:flex; align-items:flex-start; justify-content:space-between; font-size:25px; font-weight:750; color:var(--text); }
    .status-icons { letter-spacing:7px; font-size:21px; }
    .header { min-height:132px; padding:18px 42px 25px; display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--canvas2) 76%,transparent); }
    .header h1 { margin:0; font-size:39px; letter-spacing:-.025em; line-height:1.12; }
    .header p { margin:9px 0 0; color:var(--muted); font-size:22px; }
    .header-actions { display:flex; gap:14px; align-items:center; }
    .content { flex:1; min-height:0; padding:30px 32px; overflow:hidden; }
    .bottom { height:116px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); padding:15px 12px 11px; background:color-mix(in srgb,var(--canvas2) 92%,transparent); }
    .bottom-item { color:var(--muted); text-align:center; font-size:17px; }
    .bottom-item b { display:block; font-size:27px; line-height:1.1; margin-bottom:6px; font-weight:500; }
    .bottom-item.active { color:var(--accent); }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:25px; margin-bottom:22px; box-shadow:inset 0 1px rgba(255,255,255,.04); }
    .card.raised { background:var(--raised); border-color:var(--line2); box-shadow:0 20px 54px rgba(0,0,0,.12); }
    .card-title { display:flex; align-items:center; justify-content:space-between; gap:16px; font-size:27px; font-weight:800; margin-bottom:17px; }
    .section { color:var(--muted); font-size:18px; font-weight:800; letter-spacing:.08em; margin:27px 5px 12px; }
    .row { min-height:103px; display:flex; align-items:center; gap:18px; padding:17px 4px; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .avatar { flex:none; width:60px; height:60px; border-radius:18px; display:grid; place-items:center; background:var(--soft); color:var(--accent); border:1px solid var(--line2); font-size:22px; font-weight:900; }
    .row-main { min-width:0; flex:1; }
    .row-title { font-size:24px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-sub { color:var(--muted); font-size:19px; margin-top:6px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pill { display:inline-flex; align-items:center; padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--sub); font-size:17px; white-space:nowrap; }
    .pill.amber { color:var(--accent); border-color:var(--line2); background:var(--soft); }
    .pill.green { color:var(--green); }
    .pill.red { color:var(--red); }
    .pill.blue { color:var(--blue); }
    .button { display:inline-flex; align-items:center; justify-content:center; padding:14px 21px; border:1px solid var(--line); border-radius:16px; background:var(--raised); color:var(--text); font-size:20px; font-weight:750; white-space:nowrap; }
    .button.primary { background:var(--accent); color:#17130d; border-color:var(--accent); }
    .button.danger { color:var(--red); }
    .input { min-height:62px; padding:15px 18px; border-radius:17px; border:1px solid var(--line); background:var(--raised); color:var(--sub); font-size:21px; line-height:1.55; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .metric { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:20px; }
    .metric-label { color:var(--muted); font-size:17px; }
    .metric-value { font-size:39px; font-weight:900; letter-spacing:-.04em; margin:8px 0 3px; }
    .metric-note { color:var(--green); font-size:16px; line-height:1.35; }
    .callout { padding:18px 21px; border-left:5px solid var(--accent); border-radius:0 18px 18px 0; background:var(--soft); color:var(--sub); font-size:20px; line-height:1.6; }
    .code { padding:20px; border-radius:19px; border:1px solid var(--line); background:var(--code); color:var(--sub); font:18px/1.72 "WenQuanYi Zen Hei Mono",monospace; white-space:pre-wrap; overflow:hidden; }
    .add { color:var(--green); } .del { color:var(--red); } .kw { color:var(--blue); } .str { color:var(--green); }
    .progress { height:10px; border-radius:999px; overflow:hidden; background:var(--line); }
    .progress i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
    .tabs { display:flex; gap:7px; padding:6px; border-radius:18px; border:1px solid var(--line); background:var(--canvas2); }
    .tab { flex:1; text-align:center; padding:12px 9px; border-radius:13px; color:var(--muted); font-size:18px; }
    .tab.active { background:var(--raised); color:var(--text); box-shadow:0 5px 14px rgba(0,0,0,.08); }
    .tool { margin-top:16px; padding:19px; border:1px solid var(--line); border-radius:19px; background:var(--raised); }
    .tool-head { display:flex; justify-content:space-between; align-items:center; gap:14px; font-size:21px; font-weight:800; }
    .message { max-width:91%; padding:20px 22px; margin-bottom:18px; border:1px solid var(--line); font-size:21px; line-height:1.62; }
    .message.user { margin-left:auto; background:var(--soft); border-color:var(--line2); border-radius:25px 25px 5px 25px; }
    .message.agent { background:var(--surface); border-radius:5px 25px 25px 25px; }
    .message-head { display:flex; justify-content:space-between; color:var(--muted); font-size:17px; margin-bottom:13px; }
    .tree { font:20px/2.05 "WenQuanYi Zen Hei Mono",monospace; color:var(--sub); }
    .tree .active { display:block; margin-left:-10px; padding-left:10px; color:var(--text); background:var(--soft); border-radius:12px; }
    .toggle { flex:none; width:60px; height:34px; border-radius:30px; padding:6px; background:var(--accent); }
    .toggle::after { content:""; display:block; width:22px; height:22px; margin-left:26px; border-radius:50%; background:#17130d; }
    .timeline { margin-left:26px; padding-left:37px; border-left:3px solid var(--line); }
    .commit { position:relative; padding:0 0 30px 4px; }
    .commit::before { content:""; position:absolute; left:-47px; top:5px; width:17px; height:17px; border:4px solid var(--canvas); border-radius:50%; background:var(--accent); }
    .commit.merge::after { content:""; position:absolute; left:-67px; top:-15px; width:31px; height:55px; border-left:4px solid var(--blue); border-bottom:4px solid var(--blue); border-radius:0 0 0 18px; }
    .bar-chart { height:230px; display:flex; align-items:flex-end; gap:13px; border-bottom:1px solid var(--line); padding-top:20px; }
    .bar-chart i { flex:1; border-radius:9px 9px 0 0; background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 42%,transparent)); }
    .auth { height:100%; display:flex; flex-direction:column; background:
      radial-gradient(circle at 90% 10%, var(--soft), transparent 28%), var(--canvas); }
    .auth-brand { padding:50px 52px 0; display:flex; align-items:center; gap:17px; font-size:29px; font-weight:900; }
    .brand-mark { width:52px; height:52px; display:grid; place-items:center; border-radius:16px; background:linear-gradient(135deg,#ffd17a,var(--accent)); color:#17130d; box-shadow:0 0 35px var(--soft); }
    .auth-hero { padding:125px 58px 58px; }
    .eyebrow { color:var(--accent); font-size:18px; font-weight:800; letter-spacing:.12em; }
    .auth-hero h1 { margin:13px 0 20px; font-size:62px; line-height:1.14; letter-spacing:-.04em; }
    .auth-hero p { margin:0; color:var(--sub); font-size:25px; line-height:1.7; }
    .auth-card { margin:20px 38px 38px; padding:32px; border:1px solid var(--line2); border-radius:32px; background:var(--surface); box-shadow:0 30px 80px rgba(0,0,0,.15); }
    .qr { width:360px; height:360px; margin:25px auto; border:22px solid #fff; background:
      repeating-linear-gradient(0deg,#111 0 12px,#fff 12px 24px),
      repeating-linear-gradient(90deg,transparent 0 12px,#111 12px 24px);
      background-blend-mode:multiply; box-shadow:0 0 0 1px var(--line); }
    .floating { position:absolute; right:36px; bottom:144px; padding:18px 23px; border-radius:23px; border:1px solid var(--line2); background:var(--raised); box-shadow:0 22px 50px rgba(0,0,0,.25); font-size:19px; }
    .watermark { position:absolute; right:28px; bottom:125px; color:var(--muted); font-size:15px; opacity:.65; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
  const query = new URLSearchParams(location.search);
  const page = query.get("page") || "welcome";
  const selectedTheme = query.get("theme") === "light" ? "light" : "dark";
  document.body.classList.toggle("light", selectedTheme === "light");

  const P = (text,tone="") => `<span class="pill ${tone}">${text}</span>`;
  const B = (text,kind="") => `<span class="button ${kind}">${text}</span>`;
  const R = (avatar,title,sub,tail="") => `<div class="row"><div class="avatar">${avatar}</div><div class="row-main"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div>${tail}</div>`;
  const section = text => `<div class="section">${text}</div>`;
  const navItems = [
    ["sessions","◫","会话"],["devices","▣","仪表盘"],["artifacts","◇","制品"],["transfers","⇩","传输"],["settings","⚙","设置"]
  ];
  const status = () => `<div class="statusbar"><span>10:23</span><span class="status-icons">●●●　⌁　▰</span></div>`;
  const bottom = active => `<nav class="bottom">${navItems.map(([key,ic,label])=>`<div class="bottom-item ${active===key?"active":""}"><b>${ic}</b>${label}</div>`).join("")}</nav>`;
  const app = (title,subtitle,body,active="sessions",actions="") => `<div class="screen">${status()}<header class="header"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="header-actions">${actions}</div></header><main class="content">${body}</main>${bottom(active)}<div class="watermark">演示数据 · ${selectedTheme==="light"?"浅色":"深色"}主题</div></div>`;

  function welcome() {
    return `<div class="auth">${status()}<div class="auth-brand"><span class="brand-mark">A</span>AgentHub</div>
      <section class="auth-hero"><div class="eyebrow">YOUR AGENTS · EVERYWHERE</div><h1>把本机编码智能体<br>装进你的口袋</h1>
      <p>Claude Code 与 Codex 继续运行在你的机器上，手机、Web 和桌面端安全接管。</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px">${P("端到端加密","green")}${P("本机执行","amber")}${P("多端同步","blue")}</div></section>
      <section class="auth-card"><div class="card-title"><span>开始使用 AgentHub</span>${P("未登录")}</div>
      <div style="display:grid;gap:16px">${B("创建加密账户","primary")}${B("使用移动端授权登录")}${B("关联或恢复已有账户")}</div>
      ${section("自托管服务端")}<div class="input">https://agenthub.example.com:8443</div>
      <div style="display:flex;justify-content:space-between;margin-top:15px;color:var(--muted);font-size:18px"><span>可随时修改服务器地址</span><span style="color:var(--green)">● 连接正常</span></div></section></div>`;
  }

  function authorization() {
    return `<div class="auth">${status()}<div class="auth-brand"><span class="brand-mark">A</span>设备授权</div>
      <section class="auth-hero" style="padding-top:62px;padding-bottom:20px"><div class="eyebrow">LINK A NEW DEVICE</div><h1 style="font-size:52px">无需输入密码<br>安全关联新设备</h1>
      <p>使用已登录设备扫描二维码，账户密钥只在已授权客户端之间转移。</p></section>
      <section class="auth-card" style="margin-top:5px"><div class="card-title"><span>扫描二维码</span>${P("等待授权","amber")}</div>
      <div class="qr"></div><div class="progress"><i style="width:72%"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:18px"><span>临时公钥已创建</span><span>4:32 后刷新</span></div>
      ${section("操作步骤")}<div class="callout">1. 在已登录设备打开“设置 → 账户”<br>2. 选择“关联新设备”并扫描<br>3. 核对设备名称后确认授权</div>
      <div style="display:flex;gap:13px;margin-top:20px">${B("改用恢复密钥")}${B("取消")}</div>
      ${R("桌","开发机 Chrome","中国上海 · 刚刚",P("待确认","amber"))}</section></div>`;
  }

  function devices() {
    const body = `<div class="grid3">
      <div class="metric"><div class="metric-label">在线设备</div><div class="metric-value">3</div><div class="metric-note">daemon 正常</div></div>
      <div class="metric"><div class="metric-label">活跃会话</div><div class="metric-value">5</div><div class="metric-note">2 个执行中</div></div>
      <div class="metric"><div class="metric-label">传输任务</div><div class="metric-value">2</div><div class="metric-note">18.4 MB/s</div></div></div>
      ${section("开发设备")}
      <div class="card">${R("Li","上海开发机","Linux · x64 · CLI 1.0.4",P("在线","green"))}${R("Mac","设计工作站","macOS · arm64 · CLI 1.0.4",P("在线","green"))}</div>
      ${section("构建集群")}
      <div class="card">${R("CI","ARM64 构建机","Ubuntu · arm64 · 文件传输中",P("68%","amber"))}${R("Win","Windows 测试机","Windows 11 · 2 小时前",P("离线"))}</div>
      <div class="card raised"><div class="card-title"><span>上海开发机</span>${P("WebSocket 已连接","green")}</div>
        <div class="grid2">
          <div><div class="row-sub">DAEMON</div><div class="row-title">systemd · 运行中</div></div>
          <div><div class="row-sub">CLI 版本</div><div class="row-title">1.0.4 · 最新</div></div>
          <div><div class="row-sub">主机</div><div class="row-title">dev-shanghai-01</div></div>
          <div><div class="row-sub">Runner</div><div class="row-title">3 个 · 状态一致</div></div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">${B("新建会话","primary")}${B("浏览文件")}${B("查看传输")}${B("设备设置")}</div></div>`;
    return app("设备仪表盘","跨平台机器、daemon 与传输状态",body,"devices",B("＋"));
  }

  function sessions() {
    const body = `<div class="grid3">
      <div class="metric"><div class="metric-label">当前任务</div><div class="metric-value">8</div><div class="metric-note">3 个项目</div></div>
      <div class="metric"><div class="metric-label">需要处理</div><div class="metric-value" style="color:var(--accent)">2</div><div class="metric-note">权限审批</div></div>
      <div class="metric"><div class="metric-label">今日完成</div><div class="metric-value">12</div><div class="metric-note">归档 7 项</div></div></div>
      ${section("AgentHub · 上海开发机")}
      <div class="card"><div class="card-title"><span>◆ /workspace/AgentHub</span>${P("feature/readme-showcase","blue")}</div>
      ${R("C","完善 README 产品图册","Codex · 正在生成界面资源",P("正在思考","amber"))}
      ${R("Cl","修复登录恢复流程","Claude Code · 等待 Shell 权限",P("需要权限","red"))}
      ${R("C","文件传输断点续传测试","Codex · 6 分钟前完成",P("已完成","green"))}
      ${section("电脑端会话候选 · 最近 3 条")}
      ${R("↗","Git 状态同步性能优化","官方 Codex · 14 分钟前",B("接管"))}
      ${R("↗","审查 OTA 更新策略","官方 Claude · 1 小时前",B("接管"))}</div>
      <div class="card"><div class="card-title"><span>◇ /workspace/api-service</span>${P("折叠 4 个已完成任务")}</div>
      ${R("C","检查发布依赖白名单","Codex · 上下文 42%",P("执行中","blue"))}</div>`;
    return app("会话工作台","按设备与项目组织当前任务",body,"sessions",`${B("最近")}${B("＋","primary")}`);
  }

  function newSession() {
    const body = `<div class="card raised"><div class="card-title"><span>运行环境</span>${P("设备已就绪","green")}</div>
      ${section("设备")}<div class="input">上海开发机　● 在线</div>
      ${section("工作目录")}<div class="input">/workspace/AgentHub　　浏览…</div>
      ${section("智能体")}<div class="tabs"><div class="tab active">Codex</div><div class="tab">Claude Code</div></div>
      <div class="grid2" style="margin-top:20px"><div><div class="section">模型</div><div class="input">GPT-5 Codex</div></div><div><div class="section">推理强度</div><div class="input">高</div></div></div>
      <div class="grid2"><div><div class="section">权限模式</div><div class="input">按需审批</div></div><div><div class="section">托管凭据</div><div class="input">主机凭据</div></div></div>
      ${section("Worktree")}<div class="input">新建 codex/readme-showcase</div>
      ${section("初始任务")}<div class="input" style="height:215px">检查现有 README 与功能实现，补充完整的中文产品界面图册。每页同时展示深色和浅色主题，并使用可信演示数据。</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px">${P("README.md","blue")}${P("docs/app.md","blue")}${P("设计规范","amber")}</div>
      <div class="callout" style="margin-top:24px">会话启动后可在手机、Web 和桌面端继续接管。新 Worktree 与当前工作目录隔离。</div>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-top:25px">${B("保存模板")}${B("启动会话","primary")}</div></div>`;
    return app("新建会话","机器、目录、模型、权限与 Worktree",body,"sessions",B("取消"));
  }

  function conversation() {
    const body = `<div class="card" style="padding:19px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="row-title">目标进度 · 7 / 10</span>${P("上下文 42%","blue")}</div><div class="progress" style="margin-top:15px"><i style="width:72%"></i></div></div>
      <div class="message user">请补全 README 的中文产品界面，展示深浅主题和工具调用。</div>
      <div class="message agent"><div class="message-head"><span>Codex</span><span>14:32</span></div>我会先核对真实路由和功能，再生成可复现的双主题图册。
        <div class="tool"><div class="tool-head"><span>⌕ 搜索产品路由</span>${P("已完成","green")}</div><div class="row-sub">发现 16 个适合公开展示的页面组</div></div>
        <div class="tool"><div class="tool-head"><span>✎ 编辑 README.md</span>${P("进行中","amber")}</div><div class="row-sub">更新产品界面章节与图片说明</div></div></div>
      <div class="message agent"><div class="message-head"><span>进度更新</span><span>刚刚</span></div>已生成设备、会话、对话和文件管理器页面。接下来补充 Git 与安全分享。
        <div class="code"><span class="kw">const</span> completed = <span class="str">7</span>;
<span class="kw">const</span> remaining = [<span class="str">'Git'</span>, <span class="str">'Artifacts'</span>, <span class="str">'设置'</span>];</div></div>
      <div class="card" style="position:absolute;left:32px;right:32px;bottom:136px;margin:0;padding:17px"><div class="input" style="height:98px">继续生成剩余页面，并检查中文与资源引用。<span style="float:right">${B("发送","primary")}</span></div></div>`;
    return app("完善 README 产品图册","Codex · 正在理清思路",body,"sessions",B("⋯"));
  }

  function tools() {
